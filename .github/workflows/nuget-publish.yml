name: NuGet Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Ini.Serializer/Ini.Serializer.csproj

      - name: Build
        run: dotnet build Ini.Serializer/Ini.Serializer.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Ini.Serializer/Ini.Serializer.csproj --configuration Release --no-build --output ./artifacts

      - name: Push NuGet package
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Push symbol package
        run: dotnet nuget push "./artifacts/*.snupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
