name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  sast-opengrep:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenGrep
        run: |
          python -m pip install --upgrade pip
          pip install opengrep

      - name: SAST Scan (OpenGrep)
        continue-on-error: true
        run: |
          opengrep scan --config auto --json . > opengrep-results.json || opengrep --config auto --json . > opengrep-results.json

      - name: Upload OpenGrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opengrep-results
          path: opengrep-results.json
          if-no-files-found: ignore

  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Ini.Serializer.Tests/Ini.Serializer.Tests.csproj

      - name: Build
        run: dotnet build Ini.Serializer.Tests/Ini.Serializer.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Ini.Serializer.Tests/Ini.Serializer.Tests.csproj --configuration Release --no-build --verbosity normal
