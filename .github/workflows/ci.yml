name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  sast-semgrep:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pull Semgrep container
        run: |
          docker pull semgrep/semgrep:latest

      - name: SAST Scan (Semgrep)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config auto --json --output semgrep-results.json .

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: ignore

  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Ini.Serializer.Tests/Ini.Serializer.Tests.csproj

      - name: Build
        run: dotnet build Ini.Serializer.Tests/Ini.Serializer.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Ini.Serializer.Tests/Ini.Serializer.Tests.csproj --configuration Release --no-build --verbosity normal
