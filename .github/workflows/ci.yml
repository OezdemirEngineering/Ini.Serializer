name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  sast-opengrep:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pull OpenGrep container
        run: |
          docker pull ghcr.io/opengrep/opengrep:latest

      - name: SAST Scan (OpenGrep)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ghcr.io/opengrep/opengrep:latest \
            scan --config auto --json . > opengrep-results.json

      - name: Upload OpenGrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opengrep-results
          path: opengrep-results.json
          if-no-files-found: ignore

  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Ini.Serializer.Tests/Ini.Serializer.Tests.csproj

      - name: Build
        run: dotnet build Ini.Serializer.Tests/Ini.Serializer.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Ini.Serializer.Tests/Ini.Serializer.Tests.csproj --configuration Release --no-build --verbosity normal
