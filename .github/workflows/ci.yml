name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  sast-opengrep:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenGrep
        run: |
          python -m pip install --upgrade pip
          pip install opengrep

      - name: SAST Scan (OpenGrep)
        run: |
          opengrep scan --config auto --error . || opengrep --config auto --error .

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Ini.Serializer.Tests/Ini.Serializer.Tests.csproj

      - name: Build
        run: dotnet build Ini.Serializer.Tests/Ini.Serializer.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Ini.Serializer.Tests/Ini.Serializer.Tests.csproj --configuration Release --no-build --verbosity normal
